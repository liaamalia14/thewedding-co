<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thewedding.co - Planner & Budgeting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .bg-primary-gradient { background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col md:flex-row" x-data="weddingApp()" x-init="initData()">

    <!-- Loading & Toast -->
    <div x-show="isLoading" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center" x-cloak>
        <div class="w-12 h-12 border-4 border-rose-200 border-t-rose-600 rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-semibold text-slate-600">Menyinkronkan Database...</p>
    </div>
    <div x-show="toast.show" x-transition class="fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border text-sm font-medium bg-white" x-cloak>
        <i class="fas fa-info-circle text-rose-500"></i><span x-text="toast.message"></span>
    </div>

    <!-- SIDEBAR (Desktop) / BOTTOM NAV (Mobile) -->
    <aside class="fixed bottom-0 w-full md:relative md:w-64 bg-white border-t md:border-r border-slate-200 z-40 md:h-screen shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:shadow-none flex md:flex-col justify-between md:justify-start px-2 py-3 md:p-6 transition-all">
        <div class="hidden md:block text-center mb-10">
            <h1 class="font-serif text-2xl font-bold text-rose-700">thewedding.co</h1>
            <p class="text-xs text-slate-500 mt-1" x-text="countdownText"></p>
        </div>
        <nav class="flex md:flex-col w-full gap-1 md:gap-3">
            <template x-for="tab in tabs" :key="tab.id">
                <button @click="activeTab = tab.id" 
                    class="flex-1 md:w-full flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 px-2 py-2 md:py-3 md:px-4 rounded-xl text-[10px] md:text-sm font-semibold transition-all"
                    :class="activeTab === tab.id ? 'bg-rose-50 text-rose-700' : 'text-slate-500 hover:bg-slate-50'">
                    <i :class="tab.icon + ' text-base md:text-lg'"></i>
                    <span x-text="tab.name"></span>
                </button>
            </template>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 h-screen overflow-y-auto pb-24 md:pb-6 relative">
        <!-- Header area with Settings -->
        <header class="bg-primary-gradient text-white px-6 py-10 md:py-12 md:rounded-bl-[4rem] relative overflow-hidden shadow-md">
            <div class="max-w-5xl mx-auto flex justify-between items-center relative z-10">
                <div>
                    <h2 class="text-3xl md:text-4xl font-serif font-bold tracking-tight mb-2" x-text="`${settings.Pengantin_Pria || 'Nama Pria'} & ${settings.Pengantin_Wanita || 'Nama Wanita'}`"></h2>
                    <p class="text-sm text-rose-100 font-medium"><i class="far fa-calendar-alt mr-2"></i><span x-text="formatDate(settings.Tanggal_Acara)"></span></p>
                </div>
                <button @click="openModal('settings')" class="bg-white/20 hover:bg-white/30 backdrop-blur p-3 rounded-full transition-all">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <div class="max-w-5xl mx-auto px-5 -mt-6 relative z-20">
            
            <!-- TAB: DASHBOARD -->
            <div x-show="activeTab === 'dashboard'" x-cloak class="space-y-6">
                <!-- Metrics -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-xs font-semibold text-slate-500 mb-1">Target Anggaran</p>
                        <p class="text-xl font-bold text-slate-800" x-text="formatRupiah(totalEstimasi)"></p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-xs font-semibold text-slate-500 mb-1">Total Tabungan</p>
                        <p class="text-xl font-bold text-emerald-600" x-text="formatRupiah(totalTabungan)"></p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-xs font-semibold text-slate-500 mb-1">Total Pengeluaran (Realisasi)</p>
                        <p class="text-xl font-bold text-rose-600" x-text="formatRupiah(totalPengeluaran)"></p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Chart -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-800 mb-4">Grafik Keuangan</h3>
                        <div class="relative h-64 w-full"><canvas id="budgetChart"></canvas></div>
                    </div>
                    <!-- History Pengeluaran -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-800 mb-4">Riwayat Pengeluaran (Realisasi)</h3>
                        <div class="space-y-3 max-h-64 overflow-y-auto pr-2">
                            <template x-for="item in db.Budget_Vendor.filter(i => i.Realisasi > 0)" :key="item.ID">
                                <div class="flex justify-between items-center p-3 border border-slate-100 rounded-xl bg-slate-50">
                                    <div>
                                        <p class="text-sm font-bold text-slate-700" x-text="item.Nama_Vendor"></p>
                                        <p class="text-[10px] text-slate-500 uppercase tracking-wide" x-text="item.Kategori"></p>
                                    </div>
                                    <p class="text-sm font-bold text-rose-600" x-text="formatRupiah(item.Realisasi)"></p>
                                </div>
                            </template>
                            <p x-show="db.Budget_Vendor.filter(i => i.Realisasi > 0).length === 0" class="text-xs text-slate-400 text-center py-5">Belum ada pengeluaran tercatat.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB: TABUNGAN -->
            <div x-show="activeTab === 'tabungan'" x-cloak class="space-y-4">
                <div class="flex justify-between items-center pt-2">
                    <h2 class="text-xl font-bold text-slate-800">Mutasi Tabungan</h2>
                    <button @click="openModal('tabungan')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-xl"><i class="fas fa-plus mr-1"></i> Tambah</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="item in db.Tabungan" :key="item.ID">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <h4 class="text-sm font-bold text-slate-800" x-text="item.Catatan"></h4>
                                <p class="text-xs text-slate-400" x-text="`${formatDate(item.Tanggal)} • ${item.Penyetor}`"></p>
                            </div>
                            <span class="text-sm font-bold text-emerald-600" x-text="formatRupiah(item.Nominal)"></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB: VENDOR -->
            <div x-show="activeTab === 'vendor'" x-cloak class="space-y-4">
                <div class="flex justify-between items-center pt-2">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Vendor & Biaya</h2>
                        <p class="text-xs text-slate-500">Input Pengeluaran / Realisasi disini</p>
                    </div>
                    <button @click="openModal('vendor')" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold px-4 py-2 rounded-xl"><i class="fas fa-plus mr-1"></i> Tambah</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <template x-for="item in db.Budget_Vendor" :key="item.ID">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] font-bold text-rose-600 uppercase bg-rose-50 px-2 py-1 rounded" x-text="item.Kategori"></span>
                                <h3 class="text-base font-bold text-slate-800 mt-2" x-text="item.Nama_Vendor"></h3>
                                <div class="mt-3 space-y-1 text-xs">
                                    <div class="flex justify-between"><span class="text-slate-500">Estimasi</span><span class="font-bold text-slate-700" x-text="formatRupiah(item.Estimasi)"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-500">Realisasi (Keluar)</span><span class="font-bold text-rose-600" x-text="formatRupiah(item.Realisasi)"></span></div>
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                                <span class="px-2 py-1 text-[10px] rounded font-bold" :class="item.Status === 'Lunas' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'" x-text="item.Status"></span>
                                <a x-show="item.Kontak_WA" :href="`https://wa.me/${String(item.Kontak_WA).replace(/[^0-9]/g, '')}`" target="_blank" class="text-xs text-emerald-600"><i class="fab fa-whatsapp text-lg"></i></a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB: CHECKLIST -->
            <div x-show="activeTab === 'checklist'" x-cloak class="space-y-4">
                <div class="flex justify-between items-center pt-2">
                    <h2 class="text-xl font-bold text-slate-800">Checklist</h2>
                    <button @click="openModal('checklist')" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold px-4 py-2 rounded-xl"><i class="fas fa-plus mr-1"></i> Tambah</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <template x-for="item in db.Checklist" :key="item.ID">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-3 items-center">
                            <input type="checkbox" :checked="item.Status === 'Selesai'" class="w-5 h-5 accent-rose-600">
                            <div>
                                <h4 class="text-sm font-bold" :class="item.Status === 'Selesai' ? 'line-through text-slate-400' : 'text-slate-800'" x-text="item.Tugas"></h4>
                                <p class="text-xs text-slate-500" x-text="`${item.Timeline} • Prioritas ${item.Prioritas}`"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <!-- MODALS OVERLAY -->
    <div x-show="modal.type !== null" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl" @click.outside="closeModal()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800" x-text="modal.title"></h3>
                <button @click="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <!-- Form Settings -->
            <form x-show="modal.type === 'settings'" @submit.prevent="submitSettings()" class="space-y-3 text-sm">
                <div><label class="block font-semibold mb-1">Nama Pria</label><input type="text" x-model="formSettings.Pengantin_Pria" class="w-full border rounded-xl p-2.5"></div>
                <div><label class="block font-semibold mb-1">Nama Wanita</label><input type="text" x-model="formSettings.Pengantin_Wanita" class="w-full border rounded-xl p-2.5"></div>
                <div><label class="block font-semibold mb-1">Tanggal Acara</label><input type="date" x-model="formSettings.Tanggal_Acara" class="w-full border rounded-xl p-2.5"></div>
                <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl mt-2">Simpan Pengaturan</button>
            </form>

            <!-- Form Tabungan -->
            <form x-show="modal.type === 'tabungan'" @submit.prevent="submitTabungan()" class="space-y-3 text-sm">
                <div><label class="block font-semibold mb-1">Penyetor</label><select x-model="formTabungan.penyetor" class="w-full border rounded-xl p-2.5"><option>Pria</option><option>Wanita</option></select></div>
                <div><label class="block font-semibold mb-1">Nominal (Rp)</label><input type="number" x-model="formTabungan.nominal" required class="w-full border rounded-xl p-2.5"></div>
                <div><label class="block font-semibold mb-1">Catatan</label><input type="text" x-model="formTabungan.catatan" required class="w-full border rounded-xl p-2.5"></div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-2">Simpan Setoran</button>
            </form>

            <!-- Form Vendor -->
            <form x-show="modal.type === 'vendor'" @submit.prevent="submitVendor()" class="space-y-3 text-sm">
                <div><label class="block font-semibold mb-1">Kategori</label><input type="text" x-model="formVendor.kategori" placeholder="Catering / Venue" required class="w-full border rounded-xl p-2.5"></div>
                <div><label class="block font-semibold mb-1">Nama Vendor</label><input type="text" x-model="formVendor.nama" required class="w-full border rounded-xl p-2.5"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block font-semibold mb-1">Estimasi (Rp)</label><input type="number" x-model="formVendor.estimasi" required class="w-full border rounded-xl p-2.5"></div>
                    <div><label class="block font-semibold mb-1">Realisasi (Rp)</label><input type="number" x-model="formVendor.realisasi" required class="w-full border rounded-xl p-2.5"></div>
                </div>
                <div><label class="block font-semibold mb-1">Status</label><select x-model="formVendor.status" class="w-full border rounded-xl p-2.5"><option>Belum Dibayar</option><option>DP</option><option>Lunas</option></select></div>
                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl mt-2">Simpan Vendor</button>
            </form>

            <!-- Form Checklist -->
            <form x-show="modal.type === 'checklist'" @submit.prevent="submitChecklist()" class="space-y-3 text-sm">
                <div><label class="block font-semibold mb-1">Tugas</label><input type="text" x-model="formChecklist.tugas" required class="w-full border rounded-xl p-2.5"></div>
                <div><label class="block font-semibold mb-1">Timeline</label><input type="text" x-model="formChecklist.timeline" placeholder="H-3 Bulan" required class="w-full border rounded-xl p-2.5"></div>
                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl mt-2">Simpan Agenda</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbymJBdUUBRZBiq5dTw_q_ef6OyCT-nd5S1gB7w_C3UW7_7s0o30GynaQHMVUrsiBoDu/exec";

        document.addEventListener('alpine:init', () => {
            Alpine.data('weddingApp', () => ({
                isLoading: true, activeTab: 'dashboard',
                db: { Settings: {}, Tabungan: [], Budget_Vendor: [], Checklist: [] },
                settings: {}, countdownText: '', chartInstance: null,
                toast: { show: false, message: '' },
                modal: { type: null, title: '' },
                
                tabs: [
                    { id: 'dashboard', name: 'Dashboard', icon: 'fas fa-chart-pie' },
                    { id: 'tabungan', name: 'Tabungan', icon: 'fas fa-wallet' },
                    { id: 'vendor', name: 'Vendor & Biaya', icon: 'fas fa-store' },
                    { id: 'checklist', name: 'Checklist', icon: 'fas fa-list-check' }
                ],

                formSettings: { Pengantin_Pria: '', Pengantin_Wanita: '', Tanggal_Acara: '' },
                formTabungan: { penyetor: 'Pria', nominal: '', catatan: '', tanggal: new Date().toISOString().split('T')[0] },
                formVendor: { kategori: 'Venue', nama: '', estimasi: '', realisasi: 0, status: 'Belum Dibayar', kontak: '' },
                formChecklist: { tugas: '', timeline: 'H-6 Bulan', prioritas: 'Sedang' },

                get totalTabungan() { return this.db.Tabungan?.reduce((s, i) => s + (Number(i.Nominal) || 0), 0) || 0; },
                get totalPengeluaran() { return this.db.Budget_Vendor?.reduce((s, i) => s + (Number(i.Realisasi) || 0), 0) || 0; },
                get totalEstimasi() { return this.db.Budget_Vendor?.reduce((s, i) => s + (Number(i.Estimasi) || 0), 0) || 0; },

                initData() { this.fetchData(); },

                async fetchData() {
                    this.isLoading = true;
                    try {
                        const res = await (await fetch(`${API_URL}?action=read`)).json();
                        if (res.status === 'success') {
                            this.db = res.data; this.settings = this.db.Settings || {};
                            this.formSettings = { ...this.settings };
                            this.calcCountdown(); this.updateChart();
                        }
                    } catch (e) { this.showToast('Gagal memuat data'); } 
                    finally { this.isLoading = false; }
                },

                openModal(type) {
                    this.modal.type = type;
                    const titles = { settings: 'Pengaturan Profil', tabungan: 'Tambah Setoran', vendor: 'Input Pengeluaran / Vendor', checklist: 'Tambah Agenda' };
                    this.modal.title = titles[type];
                },
                closeModal() { this.modal.type = null; },

                async submitSettings() {
                    this.closeModal(); this.isLoading = true;
                    try {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'update_settings', data: this.formSettings }) });
                        this.showToast('Profil diperbarui'); await this.fetchData();
                    } catch (e) { this.showToast('Gagal menyimpan'); this.isLoading = false; }
                },

                async submitTabungan() { await this.sendData('Tabungan', ['T-' + Date.now(), this.formTabungan.tanggal, this.formTabungan.penyetor, Number(this.formTabungan.nominal), this.formTabungan.catatan]); },
                async submitVendor() { await this.sendData('Budget_Vendor', ['V-' + Date.now(), this.formVendor.kategori, this.formVendor.nama, Number(this.formVendor.estimasi), Number(this.formVendor.realisasi), this.formVendor.status, '']); },
                async submitChecklist() { await this.sendData('Checklist', ['C-' + Date.now(), this.formChecklist.tugas, this.formChecklist.timeline, 'Sedang', 'Belum']); },

                async sendData(sheet, data) {
                    this.closeModal(); this.isLoading = true;
                    try {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'insert', sheetName: sheet, data: data }) });
                        this.showToast('Data tersimpan'); await this.fetchData();
                    } catch (e) { this.showToast('Gagal menyimpan'); this.isLoading = false; }
                },

                calcCountdown() {
                    if (!this.settings.Tanggal_Acara) return;
                    const diffDays = Math.ceil((new Date(this.settings.Tanggal_Acara) - new Date()) / 86400000);
                    this.countdownText = diffDays > 0 ? `H-${diffDays} Menuju Akad` : 'Hari H';
                },

                updateChart() {
                    const ctx = document.getElementById('budgetChart');
                    if (!ctx) return;
                    if (this.chartInstance) this.chartInstance.destroy();
                    this.chartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: { labels: ['Tabungan', 'Realisasi'], datasets: [{ data: [this.totalTabungan || 1, this.totalPengeluaran || 0], backgroundColor: ['#10b981', '#e11d48'], borderWidth: 0 }] },
                        options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom' } } }
                    });
                },

                showToast(msg) { this.toast.message = msg; this.toast.show = true; setTimeout(() => this.toast.show = false, 3000); },
                formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0); },
                formatDate(d) { return d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-'; }
            }));
        });
    </script>
</body>
</html>
